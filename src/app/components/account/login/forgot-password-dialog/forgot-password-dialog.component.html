<h2 mat-dialog-title class="modal-header-title">
  {{ data.mode === 'retailer' ? 'Retailer' : 'Agent' }} Forgot Password
  <button mat-dialog-close class="modal-header-close-btn">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="mat-typography" style="max-width: 800px">
  <div>
    <p *ngIf="!submitted" class="dialog-subtitle">Enter your email address and we’ll send you a password reset link.</p>
    <p *ngIf="submitted" class="dialog-subtitle" role="status">
      {{ message }}
    </p>

    <form *ngIf="!submitted" [formGroup]="forgotForm" (ngSubmit)="submit()" class="forgot-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="name@example.com" autocomplete="email" />
        <mat-icon matPrefix>mail_outline</mat-icon>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Enter a valid email address.</mat-error>
      </mat-form-field>
    </form>
  </div>
</mat-dialog-content>

<mat-dialog-actions *ngIf="!submitted" align="end">
  <button mat-button mat-dialog-close type="button" [disabled]="loading">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="loading || forgotForm.invalid"
    [attr.aria-busy]="loading" (click)="submit()">
    <mat-spinner *ngIf="loading" class="submit-spinner" diameter="18" aria-label="Sending reset link"></mat-spinner>
    <span>{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
  </button>
</mat-dialog-actions>

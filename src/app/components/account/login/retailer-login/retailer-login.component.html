<div class="login-page">
  <section class="brand-panel" *ngIf="!isMobile">
    <img src="./assets/images/login/leap-login-left.png" alt="Leap Telecom" class="brand-image" />
  </section>

  <section class="brand-panel mobile-brand-panel" *ngIf="isMobile">
    <img src="./assets/images/login/leap-mobile-login-left.png" alt="Leap Telecom" class="brand-image" />
  </section>

  <section class="login-panel">
    <div class="login-content">
      <div class="mobile-logo" *ngIf="isMobile">
        <img src="./assets/images/logos/logo.png" alt="Leap" />
      </div>

      <header class="login-heading">
        <h2>Welcome Back! <span aria-hidden="true">👋</span></h2>
        <p>Sign in to your Leap retailer account</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form">
        <div class="form-group">
          <label for="retailer-username">Username or Email</label>
          <mat-form-field appearance="outline" class="full-width">
            <mat-icon matPrefix class="input-icon">person_outline</mat-icon>
            <input id="retailer-username" matInput type="text" formControlName="email"
              placeholder="Enter your username or email" autocomplete="username" />
            <mat-error *ngIf="hasError('email', 'required')">
              Username or email is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <label for="retailer-password">Password</label>
          <mat-form-field appearance="outline" class="full-width">
            <mat-icon matPrefix class="input-icon">lock_outline</mat-icon>
            <input id="retailer-password" matInput [type]="hidePassword ? 'password' : 'text'"
              formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
            <button mat-icon-button matSuffix type="button"
              [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
              (click)="togglePasswordVisibility()">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="hasError('password', 'required')">
              Password is required
            </mat-error>
            <mat-error *ngIf="hasError('password', 'minlength')">
              Password is not valid
            </mat-error>
          </mat-form-field>
        </div>

        <div class="forgot-password-row">
          <button type="button" class="forgot-password" (click)="forgotPassword()">
            Forgot Password?
          </button>
        </div>

        <div class="login-error" *ngIf="!isValidLogin" role="alert">
          <mat-icon>error_outline</mat-icon>
          <span>Invalid username or password</span>
        </div>

        <button mat-flat-button type="submit" class="signin-button" [disabled]="!loginForm.valid">
          <mat-icon>login</mat-icon>
          <span>Sign In</span>
        </button>
      </form>

      <button mat-stroked-button type="button" class="agent-login-button" (click)="AgentLogin()">
        Sign in as an agent
      </button>
    </div>

    <footer class="login-footer">
      <p>© 2026 Leap Telecom. All rights reserved.</p>
    </footer>
  </section>
</div>

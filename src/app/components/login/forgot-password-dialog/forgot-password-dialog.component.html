<div class="forgot-password-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title>Forgot Password</h2>
    <button mat-icon-button mat-dialog-close type="button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <p class="dialog-subtitle">Enter your email address and we’ll send you a password reset link.</p>

    <form [formGroup]="forgotForm" (ngSubmit)="submit()" class="forgot-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="name@example.com" autocomplete="email" />
        <mat-icon matPrefix>mail_outline</mat-icon>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Enter a valid email address.</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="isSubmitting || forgotForm.invalid" (click)="submit()">
      <span *ngIf="!isSubmitting">Send Reset Link</span>
      <span *ngIf="isSubmitting">Sending...</span>
    </button>
  </mat-dialog-actions>
</div>
